name: Build NEXORA

on:
  workflow_dispatch:      # ручной запуск кнопкой на сайте
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build (tests + publish + installer)
        shell: pwsh
        run: ./build/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-windows-x64
          path: |
            dist/NEXORA-Setup.exe
            dist/NEXORA.exe
            dist/NEXORA.ico
